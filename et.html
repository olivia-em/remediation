    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REMEDIATIONS</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caudex:ital,wght@0,400;0,700;1,400;1,700&family=Instrument+Serif:ital@0;1&family=Jacquard+12&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      .word-link {
        color: inherit;
        text-decoration: none;
      }

      .word-slot {
        display: inline-block;
        min-width: 6em;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="et"><a class="word-link" href="./index.html"><span class="word-slot" id="odi-word">ŌDĪ</span></a> ET <a class="word-link" href="./assets/ET.pdf" target="_blank" rel="noopener noreferrer"><span class="word-slot" id="amo-word">AMŌ</span></a></h1>
    </main>

    <script>
      const amoWords = [
        "AMŌ",
        "OTHER",
        "SLEEP",
        "LOVE",
        "BLUE",
        "GOD",
        "POOR",
        "KIND",
        "SILENCE",
        "WORLD",
        "WRONG",
        "BIG",
        "OTHERS",
      ];

      const odiWords = ["ŌDĪ", "PAST", "TRUTH", "SMILE", "EVIL", "GRIEF", "CHARGE"];

      document.addEventListener("DOMContentLoaded", () => {
        const odiWord = document.getElementById("odi-word");
        const amoWord = document.getElementById("amo-word");

        if (!odiWord || !amoWord) return;

        let odiIndex = 0;
        let amoIndex = 0;
        const cycleDuration = 14000;
        const odiDelay = cycleDuration / odiWords.length;
        const amoDelay = cycleDuration / amoWords.length;

        const renderWords = () => {
          odiWord.textContent = odiWords[odiIndex];
          amoWord.textContent = amoWords[amoIndex];
        };

        const advanceOdi = () => {
          odiIndex = (odiIndex + 1) % odiWords.length;
          renderWords();
          setTimeout(advanceOdi, odiDelay);
        };

        const advanceAmo = () => {
          amoIndex = (amoIndex + 1) % amoWords.length;
          renderWords();
          setTimeout(advanceAmo, amoDelay);
        };

        renderWords();

        setTimeout(advanceOdi, odiDelay * 0.25);
        setTimeout(advanceAmo, amoDelay * 0.75);
      });
    </script>
  </body>
</html>
